[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxconcile"
version = "0.1.0"
description = "POC: reconcile a handwritten prescription against a pharmacy bill via Gemini extraction + deterministic matching."
requires-python = ">=3.11"

# Pinned exactly. Resolved and verified against the live Vertex API on 2026-08-27.
# Bump deliberately, then re-run: make smoke
dependencies = [
    "google-genai==2.20.0",
    "google-auth==2.57.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "rapidfuzz==3.14.5",
    "scipy==1.17.1",
    "numpy==2.4.6",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "pypdfium2==5.13.0",
    # Not imported by rxconcile directly, but google-auth's ADC token-refresh
    # transport imports it at runtime. Removing it breaks credential refresh
    # with "The requests library is not installed". Keep it pinned.
    "requests==2.34.2",
    "sqlmodel==0.0.39",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pillow==12.3.0",
    "hypothesis==6.165.10",
    "pytest==9.1.1",
    "ruff==0.16.4",
    "scipy-stubs==1.17.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["rxconcile"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

# pypdfium2 is a native binding and ships no type information.
[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection requires File()/Form() calls in argument
# defaults; B008 exists for mutable defaults, which these are not.
"**/main.py" = ["B008"]
# Test doubles mirror the SDK's own untyped signatures, where Any is accurate.
"**/tests/*.py" = ["ANN401"]
