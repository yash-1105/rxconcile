[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxconcile"
version = "0.1.0"
description = "POC: reconcile a handwritten prescription against a pharmacy bill via Gemini extraction + deterministic matching."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-auth>=2.35",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["rxconcile"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
